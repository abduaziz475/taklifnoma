<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Redirecting...</title></head>
  <body>
    <script>
      const path = window.location.pathname.replace(/^\/taklifnoma/, '').replace(/^\/+/, '');
      window.location.replace(window.location.pathname.startsWith('/taklifnoma/')
        ? '/taklifnoma/?/' + encodeURIComponent(path) + window.location.search + window.location.hash
        : '/?/' + encodeURIComponent(path) + window.location.search + window.location.hash);
    </script>
  </body>
</html>
