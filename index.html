  <body>
    <script>
      (function () {
        if (window.location.search.startsWith("?/")) {
          var path = decodeURIComponent(window.location.search.slice(2));
          var cleanBase = window.location.pathname.replace(/\/+$/, "");
          var adminPath = cleanBase + "/" + path;
          window.history.replaceState(null, "", adminPath);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
